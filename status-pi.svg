<svg width="720" height="260" viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <pattern id="scanline" width="1" height="6" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>

    <pattern id="pixelgrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#3c3836" stroke-width="1" opacity="0.35"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer background -->
  <rect x="0" y="0" width="720" height="260" fill="#0d1117"/>
  <rect x="0" y="0" width="720" height="260" fill="url(#pixelgrid)"/>

  <!-- Main terminal frame -->
  <rect x="18" y="18" width="684" height="224" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <rect x="24" y="24" width="672" height="212" fill="#0b0f14" stroke="#30363d" stroke-width="2"/>

  <!-- Terminal title bar -->
  <rect x="24" y="24" width="672" height="34" fill="#111827"/>
  <rect x="36" y="36" width="10" height="10" fill="#ff5f56"/>
  <rect x="54" y="36" width="10" height="10" fill="#ffbd2e"/>
  <rect x="72" y="36" width="10" height="10" fill="#27c93f"/>

  <text x="100" y="46" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="700">
    kris@kris: ~/server/status
  </text>

  <text x="570" y="46" fill="#8b949e" font-family="monospace" font-size="12">
    LIVE
  </text>
  <rect x="610" y="36" width="10" height="10" fill="#39ff14" filter="url(#glow)"/>
  <rect x="626" y="36" width="10" height="10" fill="#39ff14" opacity="0.45"/>
  <rect x="642" y="36" width="10" height="10" fill="#39ff14" opacity="0.2"/>

  <!-- Header -->
  <text x="42" y="88" fill="#39ff14" font-family="monospace" font-size="22" font-weight="700" filter="url(#glow)">
    &gt; RASPBERRY_PI_SERVER_STATUS
  </text>
  <text x="42" y="112" fill="#8b949e" font-family="monospace" font-size="12">
    snapshot generated by cron · exported to GitHub profile README
  </text>

  <!-- Left metrics panel -->
  <rect x="42" y="130" width="300" height="76" fill="#0d1117" stroke="#30363d"/>
  <text x="58" y="152" fill="#7dd3fc" font-family="monospace" font-size="14">CPU</text>
  <text x="160" y="152" fill="#f0f6fc" font-family="monospace" font-size="14">4.5%</text>

  <text x="58" y="174" fill="#7dd3fc" font-family="monospace" font-size="14">MEM</text>
  <text x="160" y="174" fill="#f0f6fc" font-family="monospace" font-size="14">1124/3796MB</text>
  <text x="280" y="174" fill="#facc15" font-family="monospace" font-size="14">29.6%</text>

  <text x="58" y="196" fill="#7dd3fc" font-family="monospace" font-size="14">DISK</text>
  <text x="160" y="196" fill="#f0f6fc" font-family="monospace" font-size="14">47G/58G</text>
  <text x="280" y="196" fill="#facc15" font-family="monospace" font-size="14">84%</text>

  <!-- Right metrics panel -->
  <rect x="370" y="130" width="286" height="76" fill="#0d1117" stroke="#30363d"/>
  <text x="386" y="152" fill="#7dd3fc" font-family="monospace" font-size="14">UPTIME</text>
  <text x="486" y="152" fill="#f0f6fc" font-family="monospace" font-size="14">1 week, 1 day, 14 hours, 30 minutes</text>

  <text x="386" y="174" fill="#7dd3fc" font-family="monospace" font-size="14">LOAD</text>
  <text x="486" y="174" fill="#f0f6fc" font-family="monospace" font-size="14">0.10 0.10 0.17</text>

  <text x="386" y="196" fill="#7dd3fc" font-family="monospace" font-size="14">HOST</text>
  <text x="486" y="196" fill="#f0f6fc" font-family="monospace" font-size="14">kris</text>

  <!-- Pixel progress bars -->
  <text x="42" y="224" fill="#8b949e" font-family="monospace" font-size="12">
    UPDATED 2026-04-24 14:46:59 NZST
  </text>

  <rect x="540" y="214" width="10" height="10" fill="#39ff14"/>
  <rect x="556" y="214" width="10" height="10" fill="#39ff14"/>
  <rect x="572" y="214" width="10" height="10" fill="#39ff14"/>
  <rect x="588" y="214" width="10" height="10" fill="#39ff14" opacity="0.65"/>
  <rect x="604" y="214" width="10" height="10" fill="#39ff14" opacity="0.35"/>
  <rect x="620" y="214" width="10" height="10" fill="#39ff14" opacity="0.18"/>
  <!-- Scanline overlay -->
  <rect x="24" y="24" width="672" height="212" fill="url(#scanline)"/>
</svg>
